short_bio: >-
  <p>Hi! I'm Ed, a full-time faculty member of the Department of Software Technology (DST). I joined the department in 2017, although I've been with DLSU for much longer as I entered DLSU in 2010 for my BS (2013) and MS (2017) degrees. With the department, I've handled courses at all levels (SHS, UG, and GS) and typically handle courses such as Computational Thinking, Mobile Development, Natural Language Processing, Object-Oriented Programming, Operating Systems, Research Methods, and Theory of Programming Languages.</p>
  <p>I am currently the lab head for the Center of Language Technologies (CeLT), the premier NLP research lab in the Philippines. Consider following our Twitter account (<a class="inline_disabled external" href="https://twitter.com/dlsu_celt" target="_blank" rel="noopener"><span>@DLSU_CeLT</span></a>). I'm also a PhD CS student working on understanding manifestations of personality traits in social media data. I recently returned to my dissertation writing and aim to finish my program soon! I also regularly advise research topics related to my dissertation (i.e., Filipino Automatic Personality Recognition), Filipino-English Sentiment Analysis, and other topics related to Natural Language Processing, Social Media / Internet usage, and Artificial Intelligence. </p>
  <p>I am happy to work with students and collaborators that find interest in my own research interests. Feel free to hit me up if you have ideas or if you want to know what I've currently working on.</p>
  <p>Lastly, I was recently granted a sabbatical leave, so from Sep 2025 to Sep 2026, I am focused on (a) finishing my PhD, (b) continuing supervision of CeLT, and (c) establishing more research linkages. I am interested in building language resources for the Kapampangan language and in researching how well-being may manifest in lingusitic markers!</p>

